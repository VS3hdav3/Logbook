<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>logbook</title>
<style nonce="{{NONCE}}">
:root{--bg:#f4efe6;--surface:#fbf8f2;--ink:#2a2622;--muted:#6d655a;--line:#ddd4c3;--clay:#c4603c;--raw:#8c4a37;--stg:#b48a2e;--int:#6c8767;--mart:#4d6577;--ok:#5c8a62;--warn:#b48a2e;--bad:#b13e2d;
--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b18;--surface:#262320;--ink:#ece5d8;--muted:#a39a8a;--line:#3a362f;--clay:#e5865f;--raw:#c7765b;--stg:#d3a54c;--int:#8fae8a;--mart:#7d9db3;--ok:#7fb086;--warn:#d9a441;--bad:#e0705c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font:500 20px var(--serif);margin:0 auto 0 0}
input,select,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
input{width:min(320px,100%)}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,.row:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#status{padding:6px 16px;color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:70vh}
#left{border-right:1px solid var(--line);padding:10px 14px;overflow:auto;max-height:calc(100vh - 100px)}#right{padding:14px 18px;overflow:auto;max-height:calc(100vh - 100px)}
details{margin:2px 0}summary{cursor:pointer;padding:3px 0}.sha{font-family:var(--mono);color:var(--muted);margin-right:6px}
.row{display:block;padding:4px 8px;margin:2px 0 2px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.row:hover{border-color:var(--line)}.row.sel{border-color:var(--clay);background:var(--surface)}.row.priv{border-style:dashed;border-color:var(--line)}
.b{display:inline-block;font-size:11.5px;padding:0 7px;margin-right:4px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.b.finding{color:var(--clay);border-color:var(--clay)}.b.ok{color:var(--ok);border-color:var(--ok)}.b.warn{color:var(--warn);border-color:var(--warn)}.b.bad{color:var(--bad);border-color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}.raw{background:var(--raw)}.staging{background:var(--stg)}.intermediate{background:var(--int)}.mart{background:var(--mart)}
h2{font:500 22px var(--serif);margin:0 0 8px}h3{font:500 15px var(--serif);margin:14px 0 2px;text-transform:capitalize}
p.f{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12.5px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;max-height:260px;overflow:auto}
.muted{color:var(--muted)}.chip{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 4px 4px 0;display:inline-block}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}#left{border-right:0;max-height:none}}
</style>
</head>
<body>
<header>
  <h1>logbook</h1>
  <input id="q" type="search" placeholder="Search a model, path or word" aria-label="Search" autocomplete="off">
  <select id="kind" aria-label="Kind"><option value="">all kinds</option><option>finding</option><option>change</option></select>
  <select id="scope" aria-label="Scope"><option value="">everyone</option><option value="mine">mine</option><option value="shared">shared</option><option value="private">private (unpublished)</option></select>
</header>
<div id="status">loading…</div>
<main><section id="left" aria-label="History"></section><section id="right" aria-label="Detail"><p class="muted">Pick an entry to see what was wrong, why, and what fixed it.</p></section></main>
